<style>
/* Layout: numbered question strip, one question card: scenario, answer box, then model answer and a key-point checklist */
.strip{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 12px}
.strip button{min-width:42px;height:42px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:600;font-size:16px;padding:0 8px}
.strip button.full{border-color:var(--good);color:var(--good)}
.strip button.part{border-color:var(--red);color:var(--redtext)}
.strip button[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff}
.strip .sep{align-self:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 8px}
.card{max-width:1000px}
.scenario{background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:14px;line-height:1.45}
.scenario table{margin-top:8px;background:var(--paper)}
.scenario td,.scenario th{font-size:15px;padding:5px 9px}
.prompt{font-size:clamp(19px,2.2vw,22px);font-weight:700;line-height:1.35;margin:0 0 12px}
textarea{width:100%;min-height:150px;font:17px/1.5 var(--body);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.model{margin-top:16px;display:grid;gap:12px}
.mbox{border-left:6px solid var(--ink);background:var(--bg);border-radius:0 10px 10px 0;padding:12px 16px}
.mbox .h{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:4px}
.mbox p{margin:0;line-height:1.5}
.kp{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.kp label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);line-height:1.4}
.kp input{width:20px;height:20px;margin-top:1px;accent-color:var(--good);flex:none}
.kp label.on{border-color:var(--good);background:var(--goodsoft)}
.score{font-family:var(--display);font-weight:600;font-size:20px}
.left{color:var(--muted);font-size:15px;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;max-width:1000px}
</style>
</head>
<body data-page="practice-bond-short-answer">
<div class="shell">
  <main class="main"><div class="inner">
    <div class="crumb"><a href="/#practices">Practice On Your Own</a> / Unit 3: Bonds</div>
    <h1>Short Answer Practice</h1>
    <p class="lede">Questions straight from The Bond Desk and The Rating Room. Write your answer in your own words, then check it against a model answer and check off the key points you hit. Your answers save on this device.</p>
    <nav class="strip" id="strip" aria-label="Questions"></nav>
    <div id="view"></div>
    <div class="nav"><button class="btn ghost" id="prev">Previous</button><span class="left" id="pos" style="align-self:center"></span><button class="btn ghost" id="next">Next question</button></div>
  </div></main>
</div>
<script>
(function(){
// Every scenario uses the numbers from The Bond Desk (game-data.js) and The Rating Room (rating-data.js).
const Q = [
 { set:"Bond Desk", title:"Year 1: Calm Waters",
   scenario:`The Treasury rate is <b>4.0%</b>. Summit Software Inc. is rated <b>AAA</b> and offers a <b>4.3%</b> yield on a 5-year bond. The spread for AAA is +0.5%. One headline says Summit is in talks to buy its biggest rival, paid for mostly with borrowed money.`,
   prompt:"Find Summit's fair yield. Is the bond a good deal or overpriced? Would you buy it? Explain using the numbers and the news.",
   model:"Summit's fair yield is 4.0% + 0.5% = 4.5%. It only offers 4.3%, so it is overpriced: you are paid less than the bond's risk is worth. The buyout headline makes it worse, because borrowing a lot of new money usually leads to a downgrade. I would pass. (It was downgraded from AAA to AA, and its price fell.)",
   points:["Calculates the fair yield: 4.0% + 0.5% = 4.5%","Says 4.3% is below fair, so the bond is overpriced","Connects the borrowed-money buyout to a likely downgrade","Decides to pass (or explains why buying is a mistake)"] },
 { set:"Bond Desk", title:"Year 3: The Fed Strikes",
   scenario:`The Fed warns it will raise rates. Prairie State Power (rated A) offers a <b>20-year</b> bond at <b>5.0%</b>. Its price falls about <b>13%</b> if rates rise 1%. That year, rates rose from 3.5% to 4.5%, and Prairie paid every dollar of interest.`,
   prompt:"Prairie never missed a payment, yet bondholders lost money this year. Explain why, and what a better choice would have been.",
   model:"Bond prices move opposite interest rates. When rates rose 1%, this 20-year bond's price fell about 13%. The 5.0% interest couldn't make up for that, so the total return was about 5% − 13% = −8%. Longer bonds are hit hardest by rate hikes. A short bond (like Heartland's 3-year bond, which also got upgraded) or cash would have been better when the Fed was warning about hikes.",
   points:["Says rising rates push bond prices down","Explains that a long (20-year) bond falls the most","Shows interest earned was smaller than the price drop (about 5% − 13% = −8%)","Names a better choice: a short bond or cash"] },
 { set:"Bond Desk", title:"Year 4: Reach for Yield",
   scenario:`The Treasury rate is <b>4.5%</b>. Blaze Energy Drinks is rated <b>B</b> and offers <b>9.0%</b>. The spread for B is +5.5%. Headlines: Blaze signs a famous NBA star. Blaze's two biggest retail customers launch their own cheaper store-brand energy drinks.`,
   prompt:"A 9.0% yield looks great. Use the fair yield and the news to explain why Blaze was a bad buy.",
   model:"Blaze's fair yield is 4.5% + 5.5% = 10.0%. It only offers 9.0%, so even with a high yield it is overpriced for its risk. The real news was losing shelf space at its two biggest customers, which threatens its sales. The NBA deal was a red herring. Blaze defaulted, and bondholders got back only 40¢ per dollar.",
   points:["Calculates the fair yield: 4.5% + 5.5% = 10.0%","Says a high yield below fair is still overpriced","Identifies the store-brand news as the real warning","Calls the NBA deal noise (a red herring)"] },
 { set:"Bond Desk", title:"Year 2: Storm Clouds",
   scenario:`A recession is coming and the Fed hints at cutting rates. Riverside Water Authority (AA) offers a <b>20-year</b> bond at <b>5.2%</b>. Its price moves about <b>13%</b> for each 1% change in rates. Rates fell from 4.0% to 3.5%.`,
   prompt:"Riverside's bond earned about 11.7% this year even though its yield was only 5.2%. Where did the extra return come from?",
   model:"From the secondary market. When rates fall, existing bonds become more valuable, so their prices rise, and long bonds rise the most. Rates fell 0.5%, so this 20-year bond's price rose about 13 × 0.5 = 6.5%. Add the 5.2% interest and the total is about 11.7%. Water is also an essential service, so its payments stayed safe in the recession.",
   points:["Says the extra came from the bond's price rising on the secondary market","Explains falling rates make existing bonds worth more","Shows the math: about 6.5% price gain + 5.2% interest ≈ 11.7%","Mentions that long bonds gain the most (or that water is an essential service)"] },
 { set:"Bond Desk", title:"The fund rule",
   scenario:`The Bond Desk fund has a rule: no more than <b>$200K</b> in junk bonds (BB and below) in any one year, or a <b>$25,000 fine</b>. In Year 4, a desk buys $200K of Blaze (B) and $200K of Tri-County Stadium (CCC).`,
   prompt:"What happens to this desk, and why do real bond funds have rules like this?",
   model:"The desk has $400K in junk, which breaks the $200K limit, so it pays the $25,000 fine. Real funds set limits on junk because junk bonds are much more likely to default. Spreading money out and capping risky bonds keeps one or two defaults from wiping out the fund. (Here, Blaze defaulted, so the desk would lose 60% of that $200K on top of the fine.)",
   points:["Says the desk is over the limit ($400K in junk) and pays the $25,000 fine","Explains junk bonds are more likely to default","Explains the rule limits how much one bad bond can hurt the fund"] },
 { set:"Bond Desk", title:"Year 7: Inflation Scare",
   scenario:`Grocery prices are up 6% and the Fed chair says rates will keep rising. The three bonds are a 20-year AA bond at 4.9%, a 10-year BBB bond at 6.2%, and a 3-year A bond at 5.4%. Rates rose from 4.0% to 5.0%, and cash earned 4.0%.`,
   prompt:"Every bond paid on time, but cash beat all three. Explain how that can happen.",
   model:"Rising rates push bond prices down. The 20-year bond lost about 13% of its price and the 10-year about 8%, which wiped out their interest. Even the short 3-year bond fell about 3%, leaving it near 2.4%, which is below the 4.0% cash earned. When rates are about to rise, passing and holding cash can be the best move.",
   points:["Says the rate hike pushed every bond's price down","Explains longer bonds lost the most","Notes even the short bond's return fell below cash's 4.0%","Concludes that holding cash can be the right call"] },
 { set:"Bond Desk", title:"Year 6: Boom Times",
   scenario:`City of Lakewood (A) offers a 15-year bond at 5.3%. Headlines: a state report says Lakewood has set aside only 40% of the pension money it owes retired workers. The mayor proposes selling new bonds to "close the pension gap." Lakewood's new downtown park opens to big crowds.`,
   prompt:"Governments can be downgraded too. Which headlines were the warning, and which one was noise? What happened?",
   model:"The warning came from two headlines together: the city only funded 40% of what it owes retirees, and it plans to borrow even more to fill the gap. More debt plus a big unpaid promise lowers its ability to pay bondholders. The park was noise. Lakewood was downgraded from A to BBB.",
   points:["Names the 40% pension funding as a warning","Names the plan to borrow more as a warning","Calls the park noise","Says Lakewood was downgraded (A to BBB)"] },
 { set:"Rating Room", title:"Elm Ridge School District",
   scenario:`Elm Ridge has sold bonds since 1955 with every payment on time. Its surplus grew every year to <b>$30M</b>. Total debt <b>$95M</b>, yearly interest <b>$4M</b>, cash <b>$25M</b>, debt due next year <b>$10M</b>. Its bonds are general obligation bonds backed by property taxes. It scored <b>21 points: AA</b>.`,
   prompt:"Elm Ridge is a safe government borrower. Why is it AA and not AAA? Use the scorecard math.",
   model:"It missed AAA (22 points) by one point. Its debt load is $95M ÷ $30M = 3.17 years, which only scores 2, and its interest coverage is $30M ÷ $4M = 7.5x, just under the 8x line, so it scores 3. Every other factor got 4. Taxing power earns full points on one factor, but it doesn't make every factor perfect.",
   points:["Debt load: $95M ÷ $30M = 3.17 years, scores 2","Interest coverage: $30M ÷ $4M = 7.5x, scores 3 (just under 8x)","Notes the other four factors score 4 for a total of 21","Explains a government bond isn't automatically AAA"] },
 { set:"Rating Room", title:"Northgate Malls",
   scenario:`Northgate has borrowed for 30 years and never missed a payment. It made a profit every year and pays shareholders a dividend. But revenue fell from <b>$1,700M</b> to <b>$1,390M</b>, debt is <b>$3,000M</b> against <b>$550M</b> of earnings, and anchor stores keep closing as shoppers move online. It rated <b>BB</b>.`,
   prompt:"Northgate has a perfect payment record. Why is it rated junk?",
   model:"Ratings look forward, not backward. Revenue dropped 18.2%, so earnings stability scores only 1. Its debt load is $3,000M ÷ $550M = 5.45 years, scoring 1, and interest coverage is low. Malls are a shrinking industry, so backing scores 1. The perfect record earns 4 points on one factor, but the total is only 10, which is BB (junk). The dividend sends cash to shareholders instead of paying down debt.",
   points:["Says ratings look ahead at the trend, not just past payments","Uses the falling revenue (about −18%) and the weak stability score","Uses the debt load of about 5.45 years","Mentions the shrinking industry (shoppers moving online)"] },
 { set:"Rating Room", title:"Blaze Energy Drinks",
   scenario:`Blaze's revenue grew from <b>$40M</b> to <b>$600M</b> in five years. It lost money in 2022, 2023 and 2024, then earned <b>$150M</b> in 2026. Debt is <b>$920M</b> and yearly interest is <b>$95M</b>. Dozens of brands fight for the same cooler space. It has an NBA endorsement and 1.6 million social media followers. It rated <b>B</b>.`,
   prompt:"Blaze is the fastest-growing company in the room. Explain why fast growth didn't earn it a safe rating.",
   model:"Growth isn't the same as safety. Blaze made a profit in only 2 of 5 years, so stability scores 1 no matter how fast revenue grew. Its debt load is $920M ÷ $150M = 6.13 years, which scores 0, and its earnings cover interest only about 1.6 times. It's in a crowded market. The NBA deal and the followers are red herrings: they aren't on the scorecard.",
   points:["Says profit in only 2 of 5 years caps stability at 1","Debt load: $920M ÷ $150M = 6.13 years, scores 0","Interest coverage about 1.6x is thin","Calls the NBA deal and followers red herrings"] },
 { set:"Rating Room", title:"Midwest Hotels Group",
   scenario:`Midwest Hotels had record revenue and <b>$560M</b> of earnings in 2026. But in 2023 it lost <b>$150M</b> when travel collapsed. Debt <b>$2,500M</b>, interest <b>$150M</b>, cash <b>$200M</b>, debt due next year <b>$180M</b>. It rated <b>BBB</b>.`,
   prompt:"2026 was a great year. Why didn't raters give Midwest Hotels a higher rating?",
   model:"Raters look at the whole business cycle, not one year. The 2023 loss means it made a profit in only 4 of 5 years, which caps stability at 2. Hotels rise and fall with the economy, so backing scores 2. Its debt load is $2,500M ÷ $560M = 4.46 years, just under the 4.5 line, and its cash barely covers next year's debt (1.11). That adds up to 15 points: BBB, the last step before junk.",
   points:["Says raters look at the whole cycle, not one great year","Uses the 2023 loss (profit in 4 of 5 years)","Says hotels are cyclical (rise and fall with the economy)","Notes BBB is the last investment-grade step before junk"] },
 { set:"Rating Room", title:"Do the math",
   scenario:`Prairie State Power: total debt <b>$4,200M</b>, earnings <b>$1,200M</b>, yearly interest <b>$300M</b>, cash <b>$500M</b>, debt due next year <b>$400M</b>.`,
   prompt:"Calculate Prairie's debt load, interest coverage and cash cushion, and give each its score on the scorecard. Show your work.",
   model:"Debt load = $4,200M ÷ $1,200M = 3.5 years, in the 3 to under 4.5 band: 2 points. Interest coverage = $1,200M ÷ $300M = 4.0x, in the 3x to under 5x band: 2 points. Cash cushion = $500M ÷ $400M = 1.25, in the 1 to under 2 band: 3 points.",
   points:["Debt load 3.5 years → 2 points","Interest coverage 4.0x → 2 points","Cash cushion 1.25 → 3 points","Shows the division for each"] },
 { set:"Rating Room", title:"Investment grade vs. junk",
   scenario:`A company's rating is cut from <b>BBB</b> to <b>BB</b>. On The Bond Desk, a cut from BBB into junk drops a bond's price about 8%, while a one-step cut within investment grade drops it about 4%.`,
   prompt:"Explain the difference between investment grade and junk, and why falling from BBB to BB is such a big deal.",
   model:"Investment grade is BBB and higher; junk (high-yield) is BB and lower. Junk bonds are more likely to default, so they must pay higher yields. BBB is the last investment-grade step, so one notch down makes the bond junk. Its borrowing costs jump, many careful investors and funds with junk limits have to sell, and its price drops more (about 8% in the game instead of 4%).",
   points:["Defines investment grade (BBB and up) and junk (BB and down)","Says junk carries more default risk and must pay higher yields","Explains BBB to BB crosses the line into junk","Says the price drops more and borrowing costs rise"] },
 { set:"Rating Room", title:"Red herrings",
   scenario:`Case notes in The Rating Room mix real clues with red herrings, like "The Elm Ridge Eagles won the conference football title" or "Its CEO was named Utility Executive of the Year."`,
   prompt:"What is a red herring? Give one example from the games, and explain how you can tell it doesn't matter.",
   model:"A red herring is news that sounds important but doesn't change whether the borrower can pay you back. For example, Blaze's NBA endorsement or Northgate's new trampoline park. You can tell by asking whether it changes any of the six factors: payment history, earnings stability, debt load, interest coverage, cash cushion, or backing and outlook. If it doesn't, it doesn't change the rating.",
   points:["Defines a red herring as news that doesn't affect the ability to pay","Gives a real example from either game","Explains the test: does it change any scorecard factor?"] }
];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "d214-bond-short-answer";
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const st = i => S[i] || (S[i] = { text: "", shown: false, hit: [] });
let qi = Math.min(+(new URLSearchParams(location.search).get("q") || 1) - 1, Q.length - 1) || 0;

function drawStrip(){
  let last = "";
  $("#strip").innerHTML = Q.map((q, i) => { const s = S[i], cls = s && s.shown ? (s.hit.length === q.points.length ? "full" : "part") : "";
    const sep = q.set !== last ? `<span class="sep">${esc(q.set)}</span>` : ""; last = q.set;
    return sep + `<button data-i="${i}" class="${cls}" ${i === qi ? 'aria-current="true"' : ""} title="${esc(q.title)}">${i + 1}</button>`; }).join("");
  $$("#strip button").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function draw(){
  const q = Q[qi], s = st(qi);
  $("#view").innerHTML = `<article class="panel card"><div class="phead"><span class="t">${esc(q.title)}</span><span class="tag">${esc(q.set)}</span><span class="r">Question ${qi + 1} of ${Q.length}</span></div><div class="pbody">
    <div class="scenario">${q.scenario}</div>
    <p class="prompt">${esc(q.prompt)}</p>
    <textarea id="ans" placeholder="Write your answer in complete sentences. Use the numbers." aria-label="Your answer">${esc(s.text)}</textarea>
    <div class="count" id="count"></div>
    <div class="controls">${s.shown
      ? `<button class="btn ghost" id="hide">Hide the model answer</button><button class="btn ghost" id="clear">Start this one over</button>`
      : `<button class="btn" id="check">Check my answer</button><span class="left">Write something first. Then compare.</span>`}</div>
    ${s.shown ? `<div class="model"><div class="mbox"><div class="h">Model answer</div><p>${esc(q.model)}</p></div>
      <div><div class="lbl">Check off the key points your answer hit</div><ul class="kp">${q.points.map((p, i) => `<li><label class="${s.hit.includes(i) ? "on" : ""}"><input type="checkbox" data-i="${i}" ${s.hit.includes(i) ? "checked" : ""}><span>${esc(p)}</span></label></li>`).join("")}</ul>
      <div class="controls"><span class="score" id="score"></span></div></div></div>` : ""}</div></article>`;
  const ta = $("#ans"), cnt = () => { const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $("#count").textContent = w + " words"; if ($("#check")) $("#check").disabled = w < 3; };
  ta.oninput = () => { s.text = ta.value; save(); cnt(); }; cnt();
  if ($("#check")) $("#check").onclick = () => { s.shown = true; save(); drawStrip(); draw(); };
  if ($("#hide")) $("#hide").onclick = () => { s.shown = false; save(); drawStrip(); draw(); };
  if ($("#clear")) $("#clear").onclick = () => { if (!confirm("Clear your answer and checklist for this question?")) return; S[qi] = { text: "", shown: false, hit: [] }; save(); drawStrip(); draw(); };
  $$(".kp input").forEach(c => c.onchange = () => { const i = +c.dataset.i; s.hit = c.checked ? [...new Set([...s.hit, i])] : s.hit.filter(x => x !== i); save(); drawStrip(); c.closest("label").classList.toggle("on", c.checked); score(); });
  score();
  $("#pos").textContent = `${qi + 1} of ${Q.length}`; $("#prev").disabled = qi === 0; $("#next").disabled = qi === Q.length - 1;
}
function score(){ const el = $("#score"); if (!el) return; const q = Q[qi], n = st(qi).hit.length, t = q.points.length;
  el.textContent = `${n} of ${t} key points` + (n === t ? ". Full marks." : n ? ". Reread the model answer for what you missed." : ""); }
function go(i){ qi = i; history.replaceState(null, "", "?q=" + (i + 1)); drawStrip(); draw(); scrollTo(0, 0); }
$("#prev").onclick = () => qi > 0 && go(qi - 1);
$("#next").onclick = () => qi < Q.length - 1 && go(qi + 1);
drawStrip(); draw();
window.__sa = { Q };
})();
</script>
<script src="/site.js"></script>
