<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bond Short Answer | District 214 Finance &amp; Investing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<style>
/* Layout: numbered question strip, one question card: scenario, answer box, then model answer and a key-point checklist */
.strip{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 12px}
.strip button{min-width:42px;height:42px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font-family:var(--display);font-weight:600;font-size:16px;padding:0 8px}
.strip button.full{border-color:var(--good);color:var(--good)}
.strip button.part{border-color:var(--red);color:var(--redtext)}
.strip button[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff}
.strip .sep{align-self:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 8px}
.card{max-width:1000px}
.scenario{background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:14px;line-height:1.45}
.scenario table{margin-top:8px;background:var(--paper)}
.scenario td,.scenario th{font-size:15px;padding:5px 9px}
.prompt{font-size:clamp(19px,2.2vw,22px);font-weight:700;line-height:1.35;margin:0 0 12px}
textarea{width:100%;min-height:150px;font:17px/1.5 var(--body);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-top:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.model{margin-top:16px;display:grid;gap:12px}
.mbox{border-left:6px solid var(--ink);background:var(--bg);border-radius:0 10px 10px 0;padding:12px 16px}
.mbox .h{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:4px}
.mbox p{margin:0;line-height:1.5}
.kp{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.kp label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);line-height:1.4}
.kp input{width:20px;height:20px;margin-top:1px;accent-color:var(--good);flex:none}
.kp label.on{border-color:var(--good);background:var(--goodsoft)}
.score{font-family:var(--display);font-weight:600;font-size:20px}
.left{color:var(--muted);font-size:15px;font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;max-width:1000px}
</style>
</head>
<body data-page="practice-bond-short-answer">
<div class="shell">
  <main class="main"><div class="inner">
    <div class="crumb"><a href="/#unit4">Practice On Your Own</a> / Unit 4: Bonds</div>
    <h1>Short Answer Practice</h1>
    <p class="lede">Questions straight from The Bond Desk and The Rating Room. Write your answer in your own words, then check it against a model answer and check off the key points you hit. Your answers save on this device.</p>
    <nav class="strip" id="strip" aria-label="Questions"></nav>
    <div id="view"></div>
    <div class="nav"><button class="btn ghost" id="prev">Previous</button><span class="left" id="pos" style="align-self:center"></span><button class="btn ghost" id="next">Next question</button></div>
  </div></main>
</div>
<script src="/bond-short-answer-data.js"></script>
<script>
(function(){
const Q = window.BOND_SHORT_ANSWER;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "d214-bond-short-answer";
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const st = i => S[i] || (S[i] = { text: "", shown: false, hit: [] });
let qi = Math.min(+(new URLSearchParams(location.search).get("q") || 1) - 1, Q.length - 1) || 0;

function drawStrip(){
  let last = "";
  $("#strip").innerHTML = Q.map((q, i) => { const s = S[i], cls = s && s.shown ? (s.hit.length === q.points.length ? "full" : "part") : "";
    const sep = q.set !== last ? `<span class="sep">${esc(q.set)}</span>` : ""; last = q.set;
    return sep + `<button data-i="${i}" class="${cls}" ${i === qi ? 'aria-current="true"' : ""} title="${esc(q.title)}">${i + 1}</button>`; }).join("");
  $$("#strip button").forEach(b => b.onclick = () => go(+b.dataset.i));
}
function draw(){
  const q = Q[qi], s = st(qi);
  $("#view").innerHTML = `<article class="panel card"><div class="phead"><span class="t">${esc(q.title)}</span><span class="tag">${esc(q.set)}</span><span class="r">Question ${qi + 1} of ${Q.length}</span></div><div class="pbody">
    <div class="scenario">${q.scenario}</div>
    <p class="prompt">${esc(q.prompt)}</p>
    <textarea id="ans" placeholder="Write your answer in complete sentences. Use the numbers." aria-label="Your answer">${esc(s.text)}</textarea>
    <div class="count" id="count"></div>
    <div class="controls">${s.shown
      ? `<button class="btn ghost" id="hide">Hide the model answer</button><button class="btn ghost" id="clear">Start this one over</button>`
      : `<button class="btn" id="check">Check my answer</button><span class="left">Write something first. Then compare.</span>`}</div>
    ${s.shown ? `<div class="model"><div class="mbox"><div class="h">Model answer</div><p>${esc(q.model)}</p></div>
      <div><div class="lbl">Check off the key points your answer hit</div><ul class="kp">${q.points.map((p, i) => `<li><label class="${s.hit.includes(i) ? "on" : ""}"><input type="checkbox" data-i="${i}" ${s.hit.includes(i) ? "checked" : ""}><span>${esc(p)}</span></label></li>`).join("")}</ul>
      <div class="controls"><span class="score" id="score"></span></div></div></div>` : ""}</div></article>`;
  const ta = $("#ans"), cnt = () => { const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0; $("#count").textContent = w + " words"; if ($("#check")) $("#check").disabled = w < 3; };
  ta.oninput = () => { s.text = ta.value; save(); cnt(); }; cnt();
  if ($("#check")) $("#check").onclick = () => { s.shown = true; save(); drawStrip(); draw(); };
  if ($("#hide")) $("#hide").onclick = () => { s.shown = false; save(); drawStrip(); draw(); };
  if ($("#clear")) $("#clear").onclick = () => { if (!confirm("Clear your answer and checklist for this question?")) return; S[qi] = { text: "", shown: false, hit: [] }; save(); drawStrip(); draw(); };
  $$(".kp input").forEach(c => c.onchange = () => { const i = +c.dataset.i; s.hit = c.checked ? [...new Set([...s.hit, i])] : s.hit.filter(x => x !== i); save(); drawStrip(); c.closest("label").classList.toggle("on", c.checked); score(); });
  score();
  $("#pos").textContent = `${qi + 1} of ${Q.length}`; $("#prev").disabled = qi === 0; $("#next").disabled = qi === Q.length - 1;
}
function score(){ const el = $("#score"); if (!el) return; const q = Q[qi], n = st(qi).hit.length, t = q.points.length;
  el.textContent = `${n} of ${t} key points` + (n === t ? ". Full marks." : n ? ". Reread the model answer for what you missed." : ""); }
function go(i){ qi = i; history.replaceState(null, "", "?q=" + (i + 1)); drawStrip(); draw(); scrollTo(0, 0); }
$("#prev").onclick = () => qi > 0 && go(qi - 1);
$("#next").onclick = () => qi < Q.length - 1 && go(qi + 1);
drawStrip(); draw();
window.__sa = { Q };
})();
</script>
<script src="/site.js"></script>
</body>
</html>
