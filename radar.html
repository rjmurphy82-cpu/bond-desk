<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Recession Radar Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{padding-bottom:40px;-webkit-text-size-adjust:100%}
header{padding:10px 18px}header h1{font-size:24px}
main{padding:16px 16px 20px;max-width:1100px}
.center{max-width:520px;margin:30px auto}
.field{display:block;margin-top:14px}
.field span{display:block;font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--rust);font-size:14px;margin-bottom:4px}
.field input{width:100%;font-size:26px;padding:12px 14px;border:2px solid var(--rule);border-radius:10px;font-family:Barlow,Arial,sans-serif;background:#fff}
.field input.code{font-family:Oswald,Arial,sans-serif;letter-spacing:.2em;font-size:36px;text-align:center}
.link{background:none;border:0;color:var(--rust);text-decoration:underline;font-family:Barlow,Arial,sans-serif;text-transform:none;font-size:16px;padding:8px 0}
.yrhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.yrhead h2{font-size:30px;color:var(--brown);line-height:1}.yrhead .sub{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--rust);font-size:15px}
.chip{background:var(--brown);color:#fff;border-radius:10px;padding:6px 12px;text-align:center}
.chip .v{font-family:Oswald,Arial,sans-serif;font-size:24px;font-weight:700;line-height:1}.chip .k{font-size:11px;color:#CFCFCF;text-transform:uppercase}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.bignm{font-family:Oswald,Arial,sans-serif;font-size:40px;font-weight:700;color:var(--brown);line-height:1}
.pinbox{background:var(--brown);color:#fff;border-radius:12px;padding:14px 18px;text-align:center;margin-top:16px}
.pinbox .v{font-family:Oswald,Arial,sans-serif;font-size:56px;letter-spacing:.15em;color:var(--light);line-height:1.05}
.lockedcard{background:var(--brown);color:#fff;border-radius:12px;padding:18px 20px}
.lockedcard h2{font-size:32px}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.sheetbar{background:#FFF3B0;border-bottom:3px solid #E0B000;border-radius:8px;padding:8px 14px;font-size:16px;margin-bottom:12px;color:#111}
.step{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--brown);font-size:19px;margin:14px 0 6px}
.step b{display:inline-block;background:var(--orange);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:15px;margin-right:6px}
.res td{font-size:17px}.res tr.tot td{font-family:Oswald,Arial,sans-serif;font-size:22px;border-top:2px solid var(--brown)}
.rank{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rank .p{font-family:Oswald,Arial,sans-serif;font-size:60px;color:var(--orange);line-height:1}
</style>
</head>
<body>
<header><div><div class="kicker">District 214 | Finance &amp; Investing</div><h1>📡 Recession Radar Live</h1></div><div class="kicker" id="who" style="color:#CFCFCF"></div></header>
<main id="view"></main>
<script type="module" src="/radar-play.js"></script>
</body>
</html>
