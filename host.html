<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bond Desk · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.joinbox{display:flex;gap:22px;align-items:center}
.qr{width:230px;height:230px;flex:none;border-radius:10px;overflow:hidden;border:6px solid #fff}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:Oswald,Arial,sans-serif;font-size:96px;font-weight:700;color:#fff;letter-spacing:.06em;line-height:1}
.url{font-size:24px;color:#FBF3E6;margin-bottom:6px}.url b{color:var(--light)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;text-transform:none;color:var(--brown)}
.tile .nm{font-family:Oswald,Arial,sans-serif;font-size:22px;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.tile .st{font-family:Oswald,Arial,sans-serif;font-size:14px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tile.done{background:var(--brown);border-color:var(--brown);color:#fff}.tile.done .st{color:var(--light)}
.tile .x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.yr h2{font-size:40px;color:var(--brown);line-height:1}
.yr .sub{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--rust);font-size:17px}
.tbill{background:var(--brown);color:#fff;border-radius:10px;padding:8px 16px;text-align:center}
.tbill .v{font-family:Oswald,Arial,sans-serif;font-size:34px;font-weight:700;line-height:1}
.tbill .k{font-size:12px;color:#E8DCCB;text-transform:uppercase}
.clock{display:flex;gap:8px;align-items:center}
.timer{font-family:Oswald,Arial,sans-serif;font-size:46px;color:var(--brown);min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.board{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,2fr);gap:16px;align-items:start}
@media(max-width:1100px){.board{grid-template-columns:1fr}}
.bonds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1000px){.bonds{grid-template-columns:1fr}}
.codechip{font-family:Oswald,Arial,sans-serif;background:var(--sand);color:var(--brown);border-radius:8px;padding:6px 12px;font-size:16px}
.codechip b{font-size:22px;color:var(--orange)}
.ratebanner{background:var(--brown);color:#fff;border-radius:10px;padding:14px 18px;font-size:21px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.ratebanner .arrow{font-family:Oswald,Arial,sans-serif;font-size:40px;color:var(--light)}
.out{margin-top:8px;border-top:2px dashed var(--rule);padding-top:8px}
.out .story{font-size:16px;line-height:1.35}
.brk{width:100%;margin-top:6px}.brk td{padding:3px 4px;font-size:15px;border:0}.brk td.r{font-family:Consolas,monospace}
.brk tr.tot td{border-top:2px solid var(--brown);font-family:Oswald,Arial,sans-serif;font-size:20px}
.verdict{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.bond.win{border-color:var(--green)}.bond.lose{border-color:var(--red)}
.why{background:#FFF6EC;border-left:5px solid var(--orange);border-radius:0 8px 8px 0;padding:8px 10px;font-size:15px;line-height:1.35;margin-top:6px}
.why p{margin:0 0 5px}.why b{font-family:Oswald,Arial,sans-serif;font-weight:400;color:var(--rust);text-transform:uppercase;font-size:12px;letter-spacing:.04em;display:block}
.standings td{font-size:20px}.standings td.nm{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--brown)}
.standings td.pl{font-family:Oswald,Arial,sans-serif;color:var(--rust);font-size:24px}
.standings td.val{font-family:Oswald,Arial,sans-serif;font-size:24px}
.standings tr.top td{background:#FFF1E6}.standings tr.bench td{color:var(--muted);font-style:italic;background:#F7F0E4}
.picks{font-family:Consolas,monospace;font-size:15px;color:var(--muted)}
.winbar{background:var(--orange);color:#fff;border-radius:10px;padding:14px 18px;display:flex;gap:16px;align-items:center;margin-bottom:14px}
.winbar .t{font-size:56px;line-height:1}.winbar .who{font-family:Oswald,Arial,sans-serif;font-size:36px;text-transform:uppercase;line-height:1.05}
.tabs2{display:flex;gap:6px}
.tabs2 button{background:var(--card);border:2px solid var(--rule);border-radius:8px;padding:8px 16px;font-size:18px;color:var(--brown)}
.tabs2 button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:16px}
.pod{background:var(--brown);color:#fff;border-radius:12px 12px 0 0;text-align:center;padding:16px 10px}
.pod .p{font-family:Oswald,Arial,sans-serif;font-size:44px;color:var(--light);line-height:1}
.pod .n{font-family:Oswald,Arial,sans-serif;font-size:28px;text-transform:uppercase}
.pod .v{font-size:22px}
.pod.first{background:var(--orange);padding:28px 10px}.pod.first .p{color:#fff}
.lessons li{font-size:18px;line-height:1.4;margin-bottom:6px}
#offlineTag{display:none;background:var(--rust);color:#fff;border-radius:6px;padding:3px 10px;font-family:Oswald,Arial,sans-serif;font-size:14px}
.drum{position:fixed;inset:0;background:var(--brown);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;color:#fff;cursor:pointer}
.drum.on{display:flex}
.drum .k{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--light);font-size:28px}
.drum .big{font-family:Oswald,Arial,sans-serif;font-weight:700;font-size:200px;line-height:1;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<header>
  <div><div class="kicker">Hersey | Finance &amp; Investing | Unit 3: Bonds</div><h1>The Bond Desk</h1></div>
  <div style="display:flex;gap:12px;align-items:center"><span id="offlineTag">Offline mode</span><span class="kicker" style="color:#E8DCCB">Mr. Murphy | John Hersey High School</span></div>
</header>
<main id="view"></main>
<div class="modal" id="enterModal"><div class="mbox" id="enterBox"></div></div>
<div class="drum" id="drum"><div class="k" id="drumK"></div><div class="big" id="drumBig"></div></div>
<script type="module" src="/host.js"></script>
</body>
</html>
