<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recession Radar Live · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1000px){.hero{grid-template-columns:1fr}}
.joinbox{display:flex;gap:22px;align-items:center}
.qr{width:230px;height:230px;flex:none;border-radius:10px;overflow:hidden;border:6px solid #fff}
.qr svg{width:100%;height:100%;display:block}
.code{font-family:Oswald,Arial,sans-serif;font-size:96px;font-weight:700;color:#fff;letter-spacing:.06em;line-height:1}
.url{font-size:24px;color:#F4F4F4;margin-bottom:6px}.url b{color:var(--light)}
#menuBtn{display:none;background:transparent;border:2px solid #CFCFCF;color:#CFCFCF;border-radius:8px;padding:5px 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;text-transform:none;color:var(--brown)}
.tile .nm{font-family:Oswald,Arial,sans-serif;font-size:20px;text-transform:uppercase;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.tile .st{font-family:Oswald,Arial,sans-serif;font-size:13px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tile.done{background:var(--brown);border-color:var(--brown);color:#fff}.tile.done .st{color:var(--light)}
.tile .x{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.yr h2{font-size:40px;color:var(--brown);line-height:1}
.yr .sub{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--rust);font-size:17px}
.clock{display:flex;gap:8px;align-items:center}
.timer{font-family:Oswald,Arial,sans-serif;font-size:46px;color:var(--brown);min-width:110px;text-align:center}
.timer.low{color:var(--red)}
.board{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.board{grid-template-columns:1fr}}
.codechip{font-family:Oswald,Arial,sans-serif;background:var(--sand);color:var(--brown);border-radius:8px;padding:6px 12px;font-size:16px}
.codechip b{font-size:22px;color:var(--orange)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}
.tabs2 button{background:var(--card);border:2px solid var(--rule);border-radius:8px;padding:8px 16px;font-size:18px;color:var(--brown)}
.tabs2 button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.standings td{font-size:19px}.standings td.nm{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--brown)}
.standings td.pl{font-family:Oswald,Arial,sans-serif;color:var(--rust);font-size:24px}
.standings td.val{font-family:Oswald,Arial,sans-serif;font-size:24px}
.standings tr.top td{background:#FBE7EA}
.winbar{background:var(--orange);color:#fff;border-radius:10px;padding:14px 18px;display:flex;gap:16px;align-items:center;margin-bottom:14px}
.winbar .t{font-size:56px;line-height:1}.winbar .who{font-family:Oswald,Arial,sans-serif;font-size:34px;text-transform:uppercase;line-height:1.05}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:16px}
.pod{background:var(--brown);color:#fff;border-radius:12px 12px 0 0;text-align:center;padding:16px 10px}
.pod .p{font-family:Oswald,Arial,sans-serif;font-size:44px;color:var(--light);line-height:1}
.pod .n{font-family:Oswald,Arial,sans-serif;font-size:28px;text-transform:uppercase}
.pod .v{font-size:22px}
.pod.first{background:var(--orange);padding:28px 10px}.pod.first .p{color:#fff}
#offlineTag{display:none;background:var(--rust);color:#fff;border-radius:6px;padding:3px 10px;font-family:Oswald,Arial,sans-serif;font-size:14px}
.drum{position:fixed;inset:0;background:var(--brown);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:50;color:#fff;cursor:pointer;text-align:center;padding:20px}
.drum.on{display:flex}
.drum .k{font-family:Oswald,Arial,sans-serif;text-transform:uppercase;color:var(--light);font-size:30px}
.drum .big{font-family:Oswald,Arial,sans-serif;font-weight:700;font-size:150px;line-height:1;animation:pop .5s ease-out}
.drum .big.sm{font-size:96px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* Recession Radar */
.math{font-family:Oswald,Arial,sans-serif;font-size:44px;color:var(--brown);line-height:1.1}
.math .rr-shape{font-size:40px;vertical-align:middle}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.split.two{grid-template-columns:1fr 1fr}
.split>div{background:var(--card);border:2px solid var(--rule);border-radius:10px;padding:10px;min-height:130px}
.split>div.hit{border-color:var(--green);background:var(--greenbg)}
.split .h{font-family:Oswald,Arial,sans-serif;font-size:26px;color:var(--brown);display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase}
.split .h small{font-size:15px;color:var(--muted)}
.split .nm{font-size:16px;line-height:1.3;margin-top:4px;font-weight:600}
.split .nm i{font-style:normal;color:var(--rust);font-family:Oswald,Arial,sans-serif}
.storybig{font-size:22px;line-height:1.45}
.lessonbox{background:#FBF1F2;border-left:6px solid var(--orange);border-radius:0 10px 10px 0;padding:10px 14px;font-size:19px;line-height:1.4;margin-top:12px}
.timeline{display:flex;align-items:center;gap:10px;margin-top:14px;font-family:Oswald,Arial,sans-serif;font-size:20px;text-transform:uppercase;flex-wrap:wrap}
.timeline .dot{background:var(--brown);color:#fff;border-radius:8px;padding:6px 12px}
.timeline .dot.red{background:var(--red)}.timeline .dot.grn{background:var(--green)}
.timeline .ln{flex:1;min-width:60px;height:4px;background:var(--rule);position:relative}
.factlist li{font-size:17px;line-height:1.4;margin-bottom:6px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.sides>div{border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.4}
.sides b{display:block;font-family:Oswald,Arial,sans-serif;text-transform:uppercase;font-weight:600;font-size:16px}
.sides .w{background:var(--redbg)}.sides .c{background:var(--greenbg)}
</style>
</head>
<body>
<header>
  <div><div class="kicker">District 214 | Finance &amp; Investing | Unit 3: Bonds</div><h1>📡 Recession Radar Live</h1></div>
  <div style="display:flex;gap:12px;align-items:center"><span id="offlineTag">Offline mode</span><button id="menuBtn" title="Resume, start a new game, or play without iPads">☰ Menu</button></div>
</header>
<main id="view"></main>
<div class="modal" id="enterModal"><div class="mbox" id="enterBox"></div></div>
<div class="drum" id="drum"><div class="k" id="drumK"></div><div class="big" id="drumBig"></div></div>
<script type="module" src="/radar-host.js"></script>
</body>
</html>
